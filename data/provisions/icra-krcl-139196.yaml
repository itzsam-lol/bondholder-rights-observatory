- id: krcl-dscr-per-icra
  document: icra-krcl-139196
  clause: Not given in the rationale
  heading: Salient covenants of the rated facility
  page: 1
  text: >-
    ICRA has taken note of the debt service coverage ratio (DSCR) covenant breach, which is to be maintained at 1.25 times.
  instruments: [INE139F07105]
  category: financial
  metric: Debt service coverage ratio
  thresholds:
    - {comparator: ">=", value: 1.25, unit: times}
  explanation: Earnings must cover interest and principal falling due at least 1.25 times over.
  notes: >-
    Stated by a rating agency, not quoted from the contract. The trustee cites a trust deed dated 20 December 2016, which has
