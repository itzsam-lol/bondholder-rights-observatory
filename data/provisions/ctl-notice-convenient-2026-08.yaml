- id: convenient-schedule-6-a-10-d
  document: ctl-notice-convenient-2026-08
  clause: Schedule 6 PART A Clause no. 10 (d)
  heading: WITHIN 15 (FIFTEEN) BUSINESS DAYS OF ACQUISITION OF SHARES IN AN ISSUER ACQUIRED COMPANY
  page: 1
  text: >-
    (d) A copy of the Issuer Pledge Agreement, Issuer Pledge Powers of Attorney duly executed by the parties to it and
    notarised and stamped (as required in accordance with Applicable Law) to the satisfaction of the Debenture Trustee.
  instruments: [INE01W207017]
  category: other
  explanation: >-
    Within 15 business days of buying shares in a company, the issuer must give the trustee the executed pledge documents
    over those shares.
  notes: The trustee quotes this from the trust deed dated 25 September 2025. It is outside the categories of SEBI's guidance note, being a post-closing document deliverable.
- id: convenient-schedule-6-a-10-e
  document: ctl-notice-convenient-2026-08
  clause: Schedule 6 PART A Clause no. 10 (e)
  heading: WITHIN 15 (FIFTEEN) BUSINESS DAYS OF ACQUISITION OF SHARES IN AN ISSUER ACQUIRED COMPANY
  page: 1
  text: >-
    (e) Copies of the duly completed and signed Annexure W (or other applicable pledge creation form) filed with the
    Depository in respect of the Issuer Pledged Securities for creation of the pledge over the Issuer Pledged Securities to
    the satisfaction of the Debenture Trustee.
  instruments: [INE01W207017]
  category: other
  explanation: Within the same period, the issuer must give the trustee the form filed with the depository that creates the pledge.
