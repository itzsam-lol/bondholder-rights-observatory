# Disagreements and oddities in the public record. Nothing here is a finding about any issuer's or trustee's conduct.

- id: trustee-of-ine501x07588
  kind: identity
  subject: INE501X07588
  description: >-
    Catalyst Trusteeship lists this ISIN in its own breach report and sends notices to its holders as trustee, while the
    CDSL corporate bond database page prints Central Bank of India under Debenture Trustee Details, beside a due date of
    30-Dec-1999 that looks like a placeholder.
  evidence:
    - {document: ctl-t5-2026-06, page: 1, quote: INE501X07588}
    - {document: ctl-notice-aye-ine501x07588-2026-09, page: 1, quote: being the debenture trustee in respect of the said NCDs}
  observations:
    - url: https://www.cdslindia.com/CorporateBond/CorpBondDatabase.aspx?ISIN=INE501X07588
      observed_on: 2026-11-04
      value_seen: CENTRAL BANK OF INDIA

