  description: >-
    Catalyst Trusteeship's report prints one row for "Samunnati Finance Private Limited" covering INE551U ISINs and
    INE0N5S07052. The CDSL pages for those ISINs show the same name with different CINs (U65990TN2014PTC096252 and
    U65990TN2021PTC146392), and the ISINs carry different issuer codes. The dataset keeps two issuer records until the
    relationship between the two entities is established from a primary source.
