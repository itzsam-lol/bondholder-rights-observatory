- id: akara-waiver-versions
  kind: version_change
  subject: INE08XP07274
  description: >-
    Two versions of Axis Trustee's June 2026 quarter report differ in the action column: the version as on 14 August says the
    trustee is seeking instructions, and the version as on 16 September reports a waiver at a meeting that day. Only a
    reader who kept both can see when the position changed.
  evidence:
    - {document: axis-t5-2026-06-v20260814, page: 1, quote: We continue to follow up with the Issuer}
    - {document: axis-t5-2026-06-v20260916, page: 1, quote: Waiver has been received pursuant to the Debenture Holders}

- id: axis-no-information-list
  kind: version_change
  subject: axis-trustee
  description: >-
    Axis Trustee's list of issuers from which it says it has received no information has 27 names in its June 2026 quarter
    reports and 26 in its report as of 29 October 2026; Incredible Realcon Private Limited is no longer printed. The report
