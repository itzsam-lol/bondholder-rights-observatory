- id: catalyst-actual-breach-meaning
  kind: value
  subject: ctl-t5-2026-06
  description: >-
    The report's note says the date of actual breach is taken as the quarter for which the covenant certificate was
    submitted, and eight of its printed serial numbers print the quarter-end, 30 June 2026. The other six print a later date
    equal to the detection date. Intervals computed from this column therefore do not all mean the same thing.
  evidence:
    - {document: ctl-t5-2026-06, page: 5, quote: Date of Actual Breach is considered as Quarter for which covenant certiticate has been submitted}

- id: vistra-text-layer
  kind: layout
  subject: vistra-t5-2026-06
  description: >-
    The file draws much of its text as vector outlines, so text extraction returns rows 2 and 4 in part and rows 1 and 3 not
    at all, and no header. Read from text alone the report seems to lack a header, a first row and an issuer name; the
    rendered page has all of them. Anything built on extracted text alone would misread or miss this trustee's disclosures.
  evidence:
    - {document: vistra-t5-2026-06, page: 1, quote: INE629B07013}

- id: vistra-dates-precede-breach
  kind: value
  subject: INE07J407014
  description: >-
    For this ISIN the further-action cell cites emails of 30 January and 28 March 2024, before the printed breach dates of 20
    July and 20 October 2024. For INE187O07031 the printed intimation date, 6 June 2025, precedes the printed detection date,
    17 June 2025. All dates are recorded as printed.
  evidence:
    - {document: vistra-t5-2026-06, page: 1, quote: 17-06-2025}

- id: dvara-roa-exception-list
  kind: value
  subject: INE179P07589
  description: >-
    The issuer's annexure for 31 December 2025 says all covenants were complied with except those listed, and does not list
    this ISIN. It prints a return on assets of -1.02% against another ISIN. IDBI Trusteeship's June 2026 report prints, for
    this ISIN, return on assets maintained of -1.02% against a requirement of 1% or more. The documents do not say whether
    this covenant was tested at December 2025 or how each computes the ratio.
  evidence:
    - document: dvara-reg54-2026-02-11
      page: 8
      quote: The company has complied with all the covenants in respect of listed non-convertible debentures
      visual_fallback: true
    - {document: idbi-t5-2026-06, page: 1, quote: Issuer has not complied with the prescribed Return on Assets ratio}

- id: dvara-cost-to-income-limit
  kind: version_change
  subject: INE179P08082
  description: >-
    Three public statements of one covenant differ. The issuer's annexure for 31 December 2025 prints <=70%. The trustee's
    June 2026 quarter report quotes "less than 80%" from the Effective Date until the Final Settlement Date. The trustee's
    notice for the same quarter quotes "less than or equal to 80%" until September 30, 2026, and cites an Amendment Deed dated
    29 July 2026. The deed itself has not been retrieved.
  evidence:
    - document: dvara-reg54-2026-02-11
      page: 8
      quote: Cost to Income Ratio
      visual_fallback: true
    - {document: ctl-t5-2026-06, page: 4, quote: maintain the Cost to Income Ratio of less than 80%}
    - {document: ctl-notice-dvara-2026-08, page: 11, quote: Amendment Deed to the Debenture Trust Deed dated 29th July 2026}
    - {document: ctl-notice-dvara-2026-08, page: 11, quote: "until September 30, 2026 , maintain the Cost to Income Ratio of less than or equal to 80%"}
