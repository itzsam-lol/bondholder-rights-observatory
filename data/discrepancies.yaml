    - url: https://www.cdslindia.com/CorporateBond/CorpBondDatabase.aspx?ISIN=INE0N5S07052
      observed_on: 2026-11-03
      value_seen: SAMUNNATI FINANCE PRIVATE LIMITED; CIN U65990TN2021PTC146392

