# Publishers and the project's access and reuse policy for each. See docs/source-policy.md.

- id: sebi
  name: Securities and Exchange Board of India
  kind: regulator
  domains:
  - sebi.gov.in
  retrieval: allowed
  redistribution: link_only
  excerpts: short_quotation
  terms:
    reviewed_on: 2026-11-03
    urls:
    - https://www.sebi.gov.in/website-policy.html
    - https://www.sebi.gov.in/robots.txt
    summary: Website policy allows reproduction free of charge only after permission is requested by email, accurately
      and not in a misleading context. robots.txt disallows only script and style paths. Circulars are cited by
      link with short quotations; no permission has been sought, so no circular is redistributed.
- id: bse
  name: BSE Limited
  kind: exchange
  domains:
  - bseindia.com
  retrieval: manual_only
  redistribution: link_only
  excerpts: short_quotation
  terms:
    reviewed_on: 2026-11-04
    urls:
    - https://www.bseindia.com/rgess/disclaimer.htm
    summary: 'BSE''s published disclaimer states that reproduction, redistribution or transmission of information
      on the website is prohibited. No clause on automated access was found and neither bseindia.com nor bond.bseindia.com
      serves a robots.txt, but on 2026-11-04 both hosts refused the project''s identified client (an error page
      on bond.bseindia.com, HTTP 406 on www.bseindia.com) while serving the same files to browsers. The project
      treats that as an access restriction and does not disguise its client: exchange-hosted documents are downloaded
      in a browser and ingested by hash with `brdo add-document --from-file`.'
- id: nse
  name: National Stock Exchange of India Limited
  kind: exchange
  domains:
  - nseindia.com
  retrieval: excluded
  redistribution: no_links
  excerpts: none
  terms:
    reviewed_on: 2026-11-03
    urls:
    - https://www.nseindia.com/static/nse-terms-of-use
    - https://www.nseindia.com/static/hyperlinking-policy
    summary: Terms of use prohibit "any systematic or automated data collection activities (including scraping,
      data mining, data extraction and data harvesting)" and storing or republishing content without prior written
      permission. The hyperlinking policy requires prior written permission before third-party sites link to NSE.
      The project therefore neither retrieves from nor links to NSE; documents found only on NSE are logged as excluded
      by policy.
- id: cdsl
  name: Central Depository Services (India) Limited
  kind: depository
  domains:
  - cdslindia.com
  retrieval: manual_only
  redistribution: link_only
  excerpts: none
  terms:
    reviewed_on: 2026-11-03
    urls:
    - https://www.cdslindia.com/Footer/CopyRightPolicy.html
    - https://www.cdslindia.com/Footer/terms-and-condition.html
    summary: Copyright policy states that no one may copy, download or store the site's content without prior written
      permission; CDSL does not object to direct links. Its public Corporate Bond Database pages (SEBI's centralised
      database for corporate bonds) are consulted one page at a time outside the pipeline and cited by link with
      the single value observed; nothing is stored.
- id: nsdl
  name: National Securities Depository Limited
  kind: depository
  domains:
  - nsdl.com
  - nsdl.co.in
  retrieval: manual_only
  redistribution: link_only
  excerpts: none
  terms:
    reviewed_on: 2026-11-03
    urls:
    - https://nsdl.com/issuer-security-covenant-monitoring
    summary: Hosts the Security and Covenant Monitoring System, which is accessible only to registered issuers,
      debenture trustees and credit rating agencies; NSDL's page describes no public view of it. The public India
      Bond Info portal is a single-page application and is treated as a link-only source consulted outside the pipeline.
- id: bond-central
  name: Bond Central (Online Bond Platform Providers Association, with stock exchanges and depositories)
  kind: market_portal
  domains:
  - bondcentral.in
  retrieval: manual_only
  redistribution: link_only
  excerpts: none
  notes: Connections to bondcentral.in (35.207.224.245, ports 80 and 443) were refused from the project's network
    on 2026-11-03 and 2026-11-04, and from an independent fetching service on 2026-11-03. Its contents and terms
    have therefore not been assessed; its scope is described only from SEBI's launch press release of 27 February
    2025.
- id: catalyst-trusteeship
  name: Catalyst Trusteeship Limited
  kind: debenture_trustee
  sebi_registration: IND000000034
  domains:
  - catalysttrustee.com
  retrieval: allowed
  redistribution: link_only
  excerpts: short_quotation
  quote_limit: 160
  terms:
    reviewed_on: 2026-11-04
    urls:
    - https://catalysttrustee.com/robots.txt
    summary: robots.txt restricts only /wp-admin/. The site prints an all-rights-reserved notice and no terms of
      use were found; nothing found addresses automated access. The breach status reports state that they are published
      "for information of Debenture Holders, Other Intermediaries and General Public". Quotations are kept short
      as a matter of policy.
